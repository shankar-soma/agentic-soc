# Local stack: a Qdrant server plus the triage app. Mirrors the per-service
# container pattern (each service gets its own container locally, its own pod on EKS later).
#
#   docker compose up -d qdrant            # vector DB only
#   python -m soc_triage.rag.ingest_otrf --url http://localhost:6333
#   docker compose up -d app               # Gradio UI on http://localhost:7860

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: otrf_recorded_events_v1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
    ports:
      - "7860:7860"
    command: python -m soc_triage.ui
    restart: unless-stopped

volumes:
  qdrant_data:
